name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min: Render free duerme a los ~15
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping health + calentar endpoints de pago
        run: |
          for url in \
            "https://exitguard-oracle.onrender.com/health" \
            "https://exitguard-oracle.onrender.com/escape-curve?mint=DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263&sol_usd=200"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo "000")
            echo "$url -> $code"
          done
